<!DOCTYPE html>

    <style>

        /* 上部バー */
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 2px solid #1a73e8; }
        .title-box { display: flex; align-items: center; gap: 8px; }
        h1 { font-size: 1.25rem; margin: 0; color: #1a73e8; }
        .badge { background: #34a853; color: #fff; font-size: 0.78rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .btn-action { background: #e8f0fe; color: #1a73e8; border: 1px dashed #1a73e8; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .btn-clear { background: #5f6368; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .btn-export { background: #1a73e8; color: #fff; border: none; padding: 9px 18px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        .btn-export:hover { background: #1557b0; }
        input[type="file"] { display: none; }

        /* シート最上部（タイトル・日付・構内温度） */
        .sheet-header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: #f3f6fb; border: 1px solid #8fa3bf; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
        .sheet-title { font-weight: bold; font-size: 1.05rem; color: #111; }
        .header-inputs { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 0.9rem; }
        .date-input { padding: 5px 8px; border: 1px solid #666; border-radius: 4px; font-size: 0.95rem; width: 155px; background: #fffde7; font-weight: bold; }
        .kounai-group { display: flex; align-items: center; gap: 5px; background: #fff; padding: 4px 8px; border: 1px solid #8fa3bf; border-radius: 4px; font-weight: bold; }
        .kounai-input { width: 56px; padding: 4px; border: 1px solid #777; border-radius: 3px; text-align: center; font-size: 0.95rem; background: #fffde7; font-weight: bold; }

        /* 機台ジャンプボタン */
        .quick-nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
        .quick-nav a { flex: 0 0 auto; background: #f1f3f4; color: #333; text-decoration: none; font-size: 0.8rem; font-weight: bold; padding: 5px 10px; border-radius: 14px; border: 1px solid #ccc; }
        .quick-nav a:hover { background: #1a73e8; color: #fff; }

        /* Excelひな形レイアウト本体 */
        .sheet-grid { display: flex; flex-direction: column; gap: 14px; }
        .side-by-side { display: grid; grid-template-columns: 1fr; gap: 14px; }
        @media (min-width: 960px) {
            .side-by-side { grid-template-columns: 38fr 62fr; }
        }

        .panel-card { border: 2px solid #8fa3bf; border-radius: 6px; background: #fff; overflow: hidden; }
        .panel-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #dfe7f2; padding: 7px 12px; border-bottom: 1px solid #8fa3bf; font-size: 0.9rem; font-weight: bold; }
        .panel-name { font-size: 1.05rem; color: #0d47a1; min-width: 65px; }
        .temp-input { width: 64px; padding: 4px; border: 1px solid #555; border-radius: 3px; text-align: center; font-size: 0.95rem; background: #fffde7; font-weight: bold; }

        .table-scroll { overflow-x: auto; padding: 8px; }
        table.ssr-table { border-collapse: collapse; margin-bottom: 8px; }
        table.ssr-table:last-child { margin-bottom: 0; }
        table.ssr-table th { background: #f1f3f5; border: 1px solid #444; padding: 4px 5px; font-size: 0.75rem; font-weight: bold; text-align: center; min-width: 58px; white-space: nowrap; color: #111; }
        table.ssr-table td { border: 1px solid #444; padding: 0; min-width: 58px; height: 34px; background: #fffde7; }
        table.ssr-table th.empty-cell, table.ssr-table td.empty-cell { border: none; background: transparent; min-width: 58px; }
        .ssr-input { width: 100%; height: 100%; min-height: 32px; border: none; text-align: center; font-size: 0.95rem; font-family: monospace; font-weight: bold; padding: 2px; background: transparent; color: #000; }

        .ssr-input.high-temp { background: #fce8e6; color: #c5221f; }

        .bottom-export-wrap { margin-top: 16px; }
        .footer-distribute { margin-top: 18px; background: #f8f9fa; border: 1px solid #dadce0; border-radius: 8px; padding: 14px; text-align: center; }

        .qr-label { font-size: 0.78rem; font-weight: bold; color: #333; margin-bottom: 4px; }
        .footer-actions { display: flex; flex-direction: column; gap: 8px; min-width: 210px; }
    </style>
</head>

    function splitContinuousNumbers(str) {
        let s = String(str)
            .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
            .replace(/[．。、]/g, '.')
            .replace(/([0-9]+)人/g, '$1 ');
        s = s.replace(/(\.\d)(?=\d)/g, '$1 ');
        const matches = s.match(/\d+(?:\.\d+)?/g);
        return matches || [];
    }

    function createPanelCard(pName) {

        card.appendChild(header);

        const scrollWrap = document.createElement('div');
        scrollWrap.className = 'table-scroll';

        cfg.rows.forEach((rowDef, rIdx) => {
            const table = document.createElement('table');
            table.className = 'ssr-table';
            const thead = document.createElement('tr');
            const tbody = document.createElement('tr');

            rowDef.labels.forEach((lbl, cIdx) => {
                const cellCoord = rowDef.cells[cIdx];
                const th = document.createElement('th');
                const td = document.createElement('td');

                if (lbl === null || cellCoord === null) {
                    th.className = 'empty-cell';
                    td.className = 'empty-cell';
                } else {
                    th.textContent = lbl;
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.inputMode = 'decimal';
                    inp.className = 'ssr-input';
                    inp.dataset.cell = cellCoord;
                    inp.dataset.panel = pName;
                    inp.dataset.rowIdx = rIdx;
                    td.appendChild(inp);
                }
                thead.appendChild(th);
                tbody.appendChild(td);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            scrollWrap.appendChild(table);
        });

        card.appendChild(scrollWrap);
        return card;
    }

    const sheetGrid = document.getElementById('sheetGrid');
    const quickNav = document.getElementById('quickNav');

    Object.keys(PANEL_CONFIG).forEach(pName => {
        const link = document.createElement('a');
        link.href = '#panel-' + pName;
        link.textContent = pName;
        quickNav.appendChild(link);
    });

    LAYOUT_STRUCTURE.forEach(group => {
        if (group.length === 1) {
            sheetGrid.appendChild(createPanelCard(group[0]));
        } else {
            const rowWrap = document.createElement('div');
            rowWrap.className = 'side-by-side';
            group.forEach(pName => rowWrap.appendChild(createPanelCard(pName)));
            sheetGrid.appendChild(rowWrap);
        }
    });

    function updateInputStyle(inp) {
        const val = parseFloat(inp.value);
        inp.classList.remove('filled', 'high-temp');
        if (!isNaN(val)) {
            inp.classList.add(val >= 50 ? 'high-temp' : 'filled');
        }
    }

    // セルへの連続入力・ペースト時に右隣のセルへ自動振り分け
    document.addEventListener('input', function(e) {
        const target = e.target;
        if (!target.matches('.temp-input, .ssr-input')) return;

        const panelName = target.dataset.panel;
        const nums = splitContinuousNumbers(target.value);

        if (nums.length >= 2) {
            const card = document.getElementById('panel-' + panelName);
            if (target.dataset.role === 'tempUp') {
                const upInp = card.querySelector('[data-role="tempUp"]');
                const downInp = card.querySelector('[data-role="tempDown"]');
                upInp.value = nums[0];
                downInp.value = nums[1];
                updateInputStyle(upInp);
                updateInputStyle(downInp);
            } else if (target.classList.contains('ssr-input')) {
                const ssrInputs = Array.from(card.querySelectorAll('.ssr-input'));
                const startIndex = ssrInputs.indexOf(target);
                if (startIndex !== -1) {
                    nums.forEach((n, idx) => {
                        const dest = ssrInputs[startIndex + idx];
                        if (dest) {
                            dest.value = n;
                            updateInputStyle(dest);
                        }
                    });
                }
            }
        } else {
            updateInputStyle(target);
        }
    });

    // Wordファイル (.docx) 読込時に各セルへ自動反映
    function applyBulkTextToSheet(text) {
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        let currentPanel = null;
        const panelTempAssigned = {};
        const panelRowCursor = {};

        lines.forEach(line => {
            if (/^\d{4}年\d{1,2}月\d{1,2}日$/.test(line) || /^\d{1,2}月\d{1,2}日$/.test(line)) {
                document.getElementById('dateInput').value = line;
                return;
            }
            const m1 = line.match(/(?:まるいち|丸1|①)\s*(\d+(?:\.\d+)?)/);
            const m2 = line.match(/(?:まるに|丸2|②)\s*(\d+(?:\.\d+)?)/);
            const m3 = line.match(/(?:まるさん|丸3|③)\s*(\d+(?:\.\d+)?)/);
            if (m1 || m2 || m3 || /^(?:まるいち|まるに|まるさん)$/.test(line)) {
                if (m1) document.getElementById('kounai1').value = m1[1];
                if (m2) document.getElementById('kounai2').value = m2[1];
                if (m3) document.getElementById('kounai3').value = m3[1];
                return;
            }

            const norm = line.toUpperCase()
                .replace(/[Ａ-Ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
                .replace(/[\s \[\]]+/g, '')
                .replace(/[ー−―]/g, '-');

            if (PANEL_CONFIG[norm]) {
                currentPanel = norm;
                if (panelRowCursor[currentPanel] === undefined) panelRowCursor[currentPanel] = 0;
                return;
            }

            if (currentPanel) {
                const nums = splitContinuousNumbers(line);
                if (nums.length === 0) return;
                const card = document.getElementById('panel-' + currentPanel);
                if (!panelTempAssigned[currentPanel] && nums.length === 2 && panelRowCursor[currentPanel] === 0) {
                    const upInp = card.querySelector('[data-role="tempUp"]');
                    const downInp = card.querySelector('[data-role="tempDown"]');
                    upInp.value = nums[0];
                    downInp.value = nums[1];
                    updateInputStyle(upInp);
                    updateInputStyle(downInp);
                    panelTempAssigned[currentPanel] = true;
                } else {
                    const rIdx = panelRowCursor[currentPanel];
                    const rowInputs = Array.from(card.querySelectorAll('.ssr-input[data-row-idx="' + rIdx + '"]'));
                    if (rowInputs.length > 0) {
                        nums.forEach((n, cIdx) => {
                            if (cIdx < rowInputs.length) {
                                rowInputs[cIdx].value = n;
                                updateInputStyle(rowInputs[cIdx]);
                            }
                        });
                        panelRowCursor[currentPanel] = rIdx + 1;
                    }
                }
            }
        });
    }

    document.getElementById('wordFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.name.endsWith('.docx')) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                mammoth.extractRawText({ arrayBuffer: evt.target.result }).then(res => applyBulkTextToSheet(res.value));
            };
            reader.readAsArrayBuffer(file);
        } else {
            const reader = new FileReader();
            reader.onload = function(evt) { applyBulkTextToSheet(evt.target.result); };
            reader.readAsText(file);
        }
        e.target.value = '';
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
        if (!confirm('入力した測定値をすべてクリアしますか？')) return;
        document.getElementById('kounai1').value = '';
        document.getElementById('kounai2').value = '';
        document.getElementById('kounai3').value = '';
        document.querySelectorAll('.temp-input, .ssr-input').forEach(inp => {
            inp.value = '';
            updateInputStyle(inp);
        });
    });

    // Excel出力処理（2シート：リレー配置と測定温度記入シート ＆ 縦データ）
    async function exportExcel() {
        const wb = new ExcelJS.Workbook();
        const ws1 = wb.addWorksheet('リレー配置と測定温度記入シート');
        const ws2 = wb.addWorksheet('縦データ');

        const dateStr = document.getElementById('dateInput').value.trim() || getTodayJP();
        const k1 = document.getElementById('kounai1').value.trim() || '—';
        const k2 = document.getElementById('kounai2').value.trim() || '—';
        const k3 = document.getElementById('kounai3').value.trim() || '—';

        ws1.getCell('B1').value = 'ヒーター温調盤 SSRリレー表面温度記録シート';
        ws1.getCell('N1').value = '日付';
        ws1.getCell('O1').value = dateStr;
        ws1.getCell('R1').value = '構内温度';
        ws1.getCell('S1').value = '①' + k1 + (k1 !== '—' ? '℃' : '') + ' ②' + k2 + (k2 !== '—' ? '℃' : '') + ' ③' + k3 + (k3 !== '—' ? '℃' : '');

        const thinBorder = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };

        ws2.getCell('A1').value = '項目';
        ws2.getCell('A2').value = '測定日';
        ws2.getCell('A3').value = '盤内温度';
        ws2.getCell('A5').value = '測定温度';
        for (let i = 1; i <= 44; i++) {
            ws2.getCell('A' + (i + 5)).value = 'SSR' + String(i).padStart(2, '0');
        }

        const shortDateMatch = dateStr.match(/\d{1,2}月\d{1,2}日/);
        const shortDate = shortDateMatch ? shortDateMatch[0] : dateStr;

        Object.keys(PANEL_CONFIG).forEach(pName => {
            const cfg = PANEL_CONFIG[pName];
            const card = document.getElementById('panel-' + pName);
            const hRow = cfg.headerRow;
            const sc = cfg.startCol;

            ws1.getCell(hRow, sc).value = pName;
            ws1.getCell(hRow, sc + 1).value = '(盤内温度 上';
            ws1.getCell(hRow, sc + 3).value = '℃ 下';
            ws1.getCell(hRow, sc + 5).value = '℃）';

            const upVal = parseFloat(card.querySelector('[data-role="tempUp"]').value);
            const downVal = parseFloat(card.querySelector('[data-role="tempDown"]').value);
            if (!isNaN(upVal)) ws1.getCell(cfg.tempUp).value = upVal;
            if (!isNaN(downVal)) ws1.getCell(cfg.tempDown).value = downVal;

            ws2.getCell(cfg.colS2_2026 + '1').value = pName;
            ws2.getCell(cfg.colS2_2026 + '2').value = shortDate;
            if (!isNaN(upVal)) ws2.getCell(cfg.colS2_2026 + '3').value = upVal;

            cfg.rows.forEach((rowDef, rIdx) => {
                const labelRow = cfg.labelRows[rIdx];
                const valRow = labelRow + 1;
                rowDef.labels.forEach((lbl, cIdx) => {
                    if (lbl !== null) {
                        const c1 = ws1.getCell(labelRow, sc + cIdx);
                        const c2 = ws1.getCell(valRow, sc + cIdx);
                        c1.value = lbl;
                        c1.border = thinBorder;
                        c2.border = thinBorder;
                    }
                });
            });

            const ssrInputs = Array.from(card.querySelectorAll('.ssr-input'));
            ssrInputs.forEach((inp, idx) => {
                const num = parseFloat(inp.value);
                if (!isNaN(num)) {
                    ws1.getCell(inp.dataset.cell).value = num;
                    ws2.getCell(cfg.colS2_2026 + (6 + idx)).value = num;
                }
            });
        });

        let fileNameDate = dateStr.replace(/(\d{4})年(\d{1,2})月(\d{1,2})日/, (_, y, m, d) => {
            return y + String(m).padStart(2, '0') + String(d).padStart(2, '0');
        }).replace(/[^\d]/g, '') || 'SSR温度測定';

        const outBuffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([outBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileNameDate + '.xlsx';
        a.click();
        URL.revokeObjectURL(url);
    }

    document.getElementById('exportBtnTop').addEventListener('click', exportExcel);
    document.getElementById('exportBtnBottom').addEventListener('click', exportExcel);

    // 画面下部のQRコード生成（Android用 / iPhone用）＆HTML保存ボタン
    const targetUrl = window.location.href.startsWith('http') ? window.location.href : PUBLIC_APP_URL;
    ['qrAndroid', 'qrIphone'].forEach(id => {
        const el = document.getElementById(id);
        if (typeof QRCode !== 'undefined') {
            new QRCode(el, { text: targetUrl, width: 115, height: 115 });
        }
    });

    document.getElementById('copyUrlBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(targetUrl).then(() => alert('URLをコピーしました！'));
    });

    document.getElementById('downloadHtmlBtn').addEventListener('click', () => {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(url);
    });
</script>

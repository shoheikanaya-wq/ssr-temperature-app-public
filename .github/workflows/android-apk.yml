name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable Android APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SSR-temperature.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SSR-temperature-apk
          path: SSR-temperature.apk

      - name: Hold public release
        run: |
          echo "Debug APK is build-only and must not be published for third-party distribution."

# secret-refresh-trigger

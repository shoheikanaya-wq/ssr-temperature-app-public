name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable Android APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SSR-temperature.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SSR-temperature-apk
          path: SSR-temperature.apk

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes || true
          git push origin :refs/tags/android-latest || true
          gh release create android-latest SSR-temperature.apk --title "SSR温測 Android" --notes "Android配布用APK。測定・Word・Excel処理は変更していません。APKはHTTPS上のSSR温測を専用アイコンから開く配布用シェルです。" --latest

# secret-refresh-trigger

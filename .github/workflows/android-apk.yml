name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        working-directory: android
        run: gradle :app:assembleRelease

      - name: Prepare unsigned release APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" SSR-temperature-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SSR-temperature-unsigned-release
          path: SSR-temperature-unsigned.apk

      - name: Hold public release
        run: |
          echo "Unsigned release APK is artifact-only. Public distribution remains disabled until local signing is complete."

# secret-refresh-trigger
